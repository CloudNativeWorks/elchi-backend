name: Build and Push Images

on:
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_IMAGE: elchi-backend

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # No inputs: AMD64 binaries (one per envoy version) were already produced and uploaded
    # to the GitHub Release by create-release.yml. We discover them automatically here and
    # bundle each into an image via Dockerfile-release-binary (single COPY, no Go compile).
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Set Project Version
        run: echo "PROJECT_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Discover AMD64 binaries from release
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # List every elchi-backend-linux-amd64-<CP_VERSION> asset (excluding .sha256 files)
          mapfile -t BINARIES < <(gh release view "v${PROJECT_VERSION}" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name | select(startswith("elchi-backend-linux-amd64-") and (endswith(".sha256") | not))')

          if [ ${#BINARIES[@]} -eq 0 ]; then
            echo "::error::No AMD64 binaries found on release v${PROJECT_VERSION}. Run 'Create Release' workflow first."
            exit 1
          fi

          echo "Found ${#BINARIES[@]} binaries:"
          printf '  - %s\n' "${BINARIES[@]}"

          # Pick the latest (highest sort -V) as :latest tag target
          LATEST_BIN=$(printf '%s\n' "${BINARIES[@]}" | sort -V | tail -1)
          echo "latest_bin=${LATEST_BIN}" >> $GITHUB_OUTPUT

          # Persist the binary list for the next step (newline separated)
          printf '%s\n' "${BINARIES[@]}" > /tmp/binaries.txt

      - name: Download AMD64 binaries from release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p artifacts
          while IFS= read -r BIN; do
            echo "Downloading ${BIN}"
            gh release download "v${PROJECT_VERSION}" \
              --repo "${{ github.repository }}" \
              --pattern "${BIN}" \
              --dir artifacts \
              --clobber
          done < /tmp/binaries.txt
          ls -la artifacts/

      - name: Package and push images
        env:
          DOCKER_BUILDKIT: 1
          LATEST_BIN: ${{ steps.discover.outputs.latest_bin }}
        run: |
          IMAGE_NAME="${DOCKER_USERNAME}/${DOCKER_IMAGE}"

          while IFS= read -r BIN; do
            # Strip prefix to get CP_VERSION: elchi-backend-linux-amd64-<CP_VERSION>
            CONTROL_PLANE_VERSION="${BIN#elchi-backend-linux-amd64-}"
            ENVOY_VERSION=$(echo "$CONTROL_PLANE_VERSION" | sed -n 's/.*envoy\([0-9.]*\)/\1/p')

            # Dockerfile-release-binary defaults BINARY_PATH=elchi-backend-linux-amd64
            cp "artifacts/${BIN}" elchi-backend-linux-amd64

            IMAGE_TAG="${IMAGE_NAME}:v${PROJECT_VERSION}-${CONTROL_PLANE_VERSION}"

            echo "::group::Package image ${IMAGE_TAG}"

            docker buildx build \
              --platform linux/amd64 \
              --build-arg "ENVOY_VERSION=v${ENVOY_VERSION}" \
              --build-arg "ELCHI_CONTROL_PLANE_VERSION=elchi-backend-${PROJECT_VERSION}-${CONTROL_PLANE_VERSION}" \
              -t "${IMAGE_TAG}" \
              -f Dockerfile-release-binary \
              --load \
              .

            docker push "${IMAGE_TAG}"

            # Tag the highest-versioned envoy build as :latest
            if [ "${BIN}" = "${LATEST_BIN}" ]; then
              LATEST_TAG="${IMAGE_NAME}:latest"
              docker tag "${IMAGE_TAG}" "${LATEST_TAG}"
              docker push "${LATEST_TAG}"
              echo "Tagged ${IMAGE_TAG} as ${LATEST_TAG}"
            fi

            rm -f elchi-backend-linux-amd64

            echo "::endgroup::"
          done < /tmp/binaries.txt
