issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - gosec
    - sqlclosecheck
    - govet
    - unused
    - bodyclose
    - unparam
    - errorlint
    - gocritic
    - makezero
    - unconvert
    - whitespace
    - nakedret
    - inamedparam
    - usestdlibvars
    #- revive
    #- contextcheck
    #- gofumpt
    #- goimports
    #- misspell
    #- testifylint
    #- goconst
    #- prealloc
    #- perfsprint
    #- forcetypeassert
    #- funlen
    #- containedctx
    #- nestif
    #- err113
    #- cyclop

linters-settings:
  exhaustive:
    default-signifies-exhaustive: true
  gofumpt:
    extra-rules: true
  goimports:
    local-prefixes: github.com/CloudNativeWorks/elchi-backend
  gosec:
    excludes:
      - G115
  misspell:
    locale: US

  unparam:
    check-exported: false
run:
  timeout: 10m
