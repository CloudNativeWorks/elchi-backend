issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - gosec
    - contextcheck
    - sqlclosecheck
    - govet
    - unused
    - bodyclose
    - unparam
    - errorlint
    - gocritic
    #- revive
    - makezero

    # - gofumpt
    # - goimports
    # - misspell
    # - testifylint
    # - unconvert
    # - whitespace
    # - goconst
    # - prealloc
    # - nakedret
    # - perfsprint
    # - funlen
    # - containedctx
    # - forcetypeassert
    # - inamedparam
    # - usestdlibvars
    # - nestif
    # - err113
    # - cyclop

linters-settings:
  exhaustive:
    default-signifies-exhaustive: true
  gofumpt:
    extra-rules: true
  goimports:
    local-prefixes: github.com/CloudNativeWorks/elchi-backend
  gosec:
    excludes:
      - G115
  misspell:
    locale: US

  unparam:
    check-exported: false
run:
  timeout: 10m
