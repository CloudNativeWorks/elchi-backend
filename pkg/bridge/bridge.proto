syntax = "proto3";

package bridge;

import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";

option go_package = ".;bridge";

service SnapshotService {
  rpc GetNodeSnapshot(NodeSnapshotRequest) returns (NodeSnapshotResponse);
  rpc ClearNodeSnapshot(NodeSnapshotRequest) returns (ClearSnapshotResponse);
}

service PokeService {
  rpc Poke(PokeRequest) returns (PokeResponse);
  rpc NotifyUndeploy(UndeployRequest) returns (UndeployResponse);
}

service ResourceService {
  rpc ValidateResource(ValidateResourceRequest) returns (ValidateResourceResponse);
}

message Client {
  string server_address = 1;
  string node_id = 2;
  int64 first_connected = 3;
  int64 last_seen = 4;
  int64 connection_count = 5;
  string client_addr = 6;
  string local_addr = 7;
  repeated int64 stream_ids = 8;
  repeated ErrorEntry errors = 9;
  int64 request_count = 10;
}

message ErrorEntry {
  string message = 1;
  string resource_id = 2;
  string response_nonce = 3;
  int32 count = 4;
  bool resolved = 5;
  string timestamp = 6;
}

message NodeErrorResponse {
  repeated ErrorEntry errors = 1;
}

message PokeRequest {
  string nodeID = 1;
  string project = 2;
  string version = 3;
  string downstream_address = 4;
  bool is_config_update = 5; // True for real config updates, false for control-plane restart
}

message PokeResponse { string message = 1; }

message UndeployRequest {
  string nodeID = 1;
  string project = 2;
  string serviceName = 3;
  string downstreamAddress = 4;
}

message UndeployResponse { string message = 1; }

// New messages for node snapshot operations
message NodeSnapshotRequest {
  string node_id = 1;
  string version = 2;  // Envoy version (optional, for routing)
}

message NodeSnapshotResponse {
  string node_id = 1;
  repeated SnapshotResource resources = 2;
  int64 num_watches = 3;
  string last_watch = 4;
}

message ClearSnapshotResponse {
  bool success = 1;
  string message = 2;
  string node_id = 3;
}

message SnapshotResource {
  string type = 1;  // CDS, LDS, RDS, EDS, etc.
  google.protobuf.Struct data = 2;
}

message ValidateResourceRequest {
  string gtype = 1;
  google.protobuf.Any resource = 2;
}

message ValidateResourceResponse {
  string error = 1;
}